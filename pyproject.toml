[project]
name = "movie-database"
version = "0.1.0"
description = "Reusable movie database utilities"
authors = [
    { name = "Samuel Todd" }
]
requires-python = ">=3.9"

dependencies = [
    "psycopg2-binary>=2.9.12,<3.0.0"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"